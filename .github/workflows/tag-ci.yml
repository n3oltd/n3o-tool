name: Tag CI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build-pack-push:
    name: Build, Pack, Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: n3oltd/actions/.github/actions/dotnet-build-pack-push@main
        with:
          run-pack: true
          nuget-user: n3oltd
